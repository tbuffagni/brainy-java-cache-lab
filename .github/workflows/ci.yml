name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and provenance checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository and pinned submodule
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Java and Maven cache
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            vendor/commons-jcs4-main/pom.xml
            vendor/commons-jcs4-main/commons-jcs4-core/pom.xml
            press/benchmark/project/pom.xml

      - name: Verify the frozen JCS revision
        shell: bash
        run: |
          test "$(git -C vendor/commons-jcs4-main rev-parse HEAD)" = "fb3f101b87709b713468e8d827b8612e6e65f29b"
          test -z "$(git -C vendor/commons-jcs4-main status --porcelain)"

      - name: Run Python tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Verify published checksums
        run: sha256sum --check press/results/SHA256SUMS

      - name: Install the pinned JCS 4 core
        run: mvn -B -ntp -f vendor/commons-jcs4-main/pom.xml -pl commons-jcs4-core -am -DskipTests install

      - name: Test the benchmark harness
        run: mvn -B -ntp -f press/benchmark/project/pom.xml test
